# qBraid Skill manifest - CHIMERA-QRC (Team EIGENNEXUS, GIC 2026 Phase 3)
# A structured, agent-executable description of how to reproduce every result.
# Pair with cli.py: `python3 cli.py run <action>`. This file is the machine-readable
# index; SKILL.md is the human/agent narrative.
name: chimera-qrc
team: EIGENNEXUS
track: A  # Financial Volatility
title: "CHIMERA-QRC: Regime-Aware Quantum Reservoir Computing for S&P 500 Realized Volatility"
entrypoint: "python3 cli.py"
environment:
  python: ">=3.10"
  install: "pip install -r requirements.txt"
  offline_capable: true   # all data bundled (Oxford-Man RV, SPY, MNIST subset)
  notes: >
    Pure-NumPy quantum reservoir engine (no Qiskit/PennyLane required for the core;
    PennyLane only for the explicit-circuit SDK demo). Runs headless on qBraid.

reservoir_config:   # the knobs an agent can vary
  n_qubits: {type: int, default: 8, range: [3, 16], note: "dense exact <=12; sparse/TN backend reaches ~16"}
  tau: {type: float, default: 2.0, note: "evolution time; multi-scale uses a tau-bank"}
  hamiltonian: {enum: [ising, heisenberg], default: ising}
  connectivity: {type: float, default: 0.5}
  encoder: {enum: [univariate_lags, rich_realized_measures, data_reuploading], default: univariate_lags}
  noise: {enum: [none, depolarizing, amplitude_damping], default: none}
  noise_rate: {type: float, default: 0.0}
  seeds: {default: [0, 1, 2]}

actions:
  - id: tests
    desc: "Engine sanity tests (24 checks)"
    cmd: "python3 cli.py run tests"
    expect: "24 passed, 0 failed"
  - id: kernel
    desc: "Kernel geometry distinctness"
    cmd: "python3 cli.py run kernel"
    expect: "g(ESN-108 -> CHIMERA) ~ 64 vs ~3.7 classical control"
  - id: calm
    desc: "Calm-window Table 1 + Model Confidence Set (Phase-2 reproduction)"
    cmd: "python3 cli.py run calm"
    expect: "calm-window RMSE/QLIKE/MZ table + MCS p-values"
  - id: sdk
    desc: "Explicit PennyLane circuit reproduces the NumPy engine"
    cmd: "python3 cli.py run sdk"
    expect: "engine match ~ 4e-16 (machine precision)"
  - id: gk
    desc: "Independent 2022-2026 SPY (Garman-Klass) out-of-sample check"
    cmd: "python3 cli.py run gk"
    expect: "same qualitative ranking on an independent recent sample"
  - id: tensor_check
    desc: "Verify the sparse backend matches the dense engine"
    cmd: "python3 cli.py run tensor_check"
    expect: "max|sparse - dense| ~ 1e-14 (OK)"
  - id: crisis
    desc: "Crisis-window regime tracking (Phase-2; vs PLAIN HAR only)"
    cmd: "python3 cli.py run crisis"
    expect: >
      CHIMERA-3scale MZ R^2 0.591 vs plain HAR 0.559 - a regime-tracking property, NOT a
      forecasting win: the decisive HAR-X test (axisB_rig) shows no significant advantage.
  - id: prereg
    desc: "Pre-registered H0/H1/H4 confirm-refute thresholds (committed before running)"
    cmd: "python3 cli.py run prereg"
    expect: "prints H0/H1/H4 statements + decision constants"
  - id: axisB
    desc: "Axis-B mechanism: informed encoding restores kernel distinctness/rank vs idle qubits"
    cmd: "python3 cli.py run axisB"
    expect: "informed qubits restore g (52->158) and D_eff (1.5->3.1) vs idle qubits"
  - id: axisB_rig
    desc: "Axis-B HARDENED (the decisive, honest test): HAR-X + recurrent-ESN + RFF, HAC-DM, Holm"
    cmd: "python3 cli.py run axisB_rig"
    expect: >
      HAR-X (rich features, linear) is best/co-best at every n; CHIMERA never beats it and is
      n.s. vs ESN/RFF after Holm. NO quantum advantage at simulable scale -> H0 REFUTED
      (pre-registered). CHIMERA is competitive + lower seed variance than the ESN.
  - id: canonical
    desc: "Named canonical realized-vol models (SHAR/HAR-CJ/HARQ/HEAVY-RM) vs HAR-X & CHIMERA; MSE + QLIKE DM"
    cmd: "python3 cli.py run canonical"
    expect: >
      No named canonical model beats HAR-X (so HAR-X is a fair strong stand-in, not a strawman);
      CHIMERA ties the best on RMSE with only a raw, non-Holm-significant QLIKE/MZ efficiency edge.
  - id: economics
    desc: "Volatility-timing backtest (Fleming-Kirby-Ostdiek): Sharpe/drawdown/turnover + CE fee"
    cmd: "python3 cli.py run economics"
    expect: >
      Vol-timing nearly halves crisis max-drawdown (-61%->-32%); but plain HAR captures it and
      neither rich features nor CHIMERA add economic value (negative CE fees) -> no economic
      quantum advantage, consistent with the statistical negative.
  - id: capacity
    desc: "Information-processing capacity (Dambre-style): CHIMERA vs matched RFF/ESN, linear vs nonlinear"
    cmd: "python3 cli.py run capacity"
    expect: >
      CHIMERA does NOT have higher nonlinear capacity (lower than RFF/ESN at matched feature
      count) -> the quantum reservoir is not more expressive at simulable scale; deepens the
      honest negative.
  - id: frontier
    desc: "Classical-irreproducibility g(n) to the n=16 sparse frontier under fully-informed encoding"
    cmd: "python3 cli.py run frontier"
    expect: >
      Whether g(ESN||CHIMERA) keeps growing to n=16 under informed encoding (necessary-not-
      sufficient for beyond-frontier advantage) or saturates; reported honestly either way.
  - id: noise_circuit
    desc: "Per-Trotter-layer vs readout-only noise on the gate-Trotter circuit (density-matrix sim)"
    cmd: "python3 cli.py run noise_circuit"
    expect: >
      Readout-only depolarizing -> standardized feature error ~0 (the MNIST 'invariance' is a
      standardization artifact); per-LAYER noise is NOT removed (grows with rate) -> the real
      NISQ degradation over the 380-gate circuit.
  - id: qpu_dryrun
    desc: "QPU readiness check: gate/shot/cost plan + device-wiring probe (no credits needed)"
    cmd: "python3 cli.py run qpu_dryrun"
    expect: "380-native-gate plan, 36 Z-diagonal observables, cost estimate; READY when a device opens"
  - id: qpu_selftest
    desc: "Verify the emitted QASM2 IS the reservoir (independent interpreter) + fold identity"
    cmd: "python3 cli.py run qpu_selftest"
    expect: "max|QASM - engine| ~ 0.04 (Trotter-20 systematic); fold-3 identity ~1e-14; PASS"
  - id: qpu_rehearsal
    desc: "FULL-DRESS offline QPU rehearsal: counts readout + tensor-model readout mitigation + gate-folding ZNE + classical cross-check (identical credit-day pipeline; local noisy stand-in QPU)"
    cmd: "python3 cli.py run qpu_rehearsal"
    expect: "mitigation chain REDUCES mean feature error (raw -> readout-mitigated -> ZNE); pipeline validated; on credit day run: python3 qpu_run.py --mode hw --device <id>"
  - id: scaling
    desc: "Scaling sweep g(n)/MZ-gap(n)/rank(n) + depolarizing/amplitude-damping noise"
    cmd: "python3 cli.py run scaling"
    expect: "fixed-univariate-encoder bottleneck: g/rank saturate (pre-Axis-B)"
  - id: mnist
    desc: "Common cross-team MNIST benchmark (accuracy vs qubit count)"
    cmd: "python3 cli.py run mnist"
    expect: "accuracy grows with n (0.63->0.86 n=5->12; 0.88 at n=15 sparse via --n15); CHIMERA >> linear, ~= ESN"
  - id: mnist_noise
    desc: "MNIST noise-rate robustness curve (depolarizing + amplitude damping)"
    cmd: "python3 cli.py run mnist_noise"
    expect: "QRC invariant to depolarizing (standardization absorbs uniform contraction); robust to amplitude damping"
  - id: tensor
    desc: "Sparse/TN frontier beyond n=12 + bond-dimension complexity metric"
    cmd: "python3 cli.py run tensor"
    expect: "g(n) and effective bond dimension chi_eff(n) up to n~16; chi grows toward classical wall"
  - id: qsubmit
    desc: "Executable qBraid submission path (shot budget + ZNE + classical cross-check)"
    cmd: "python3 cli.py run qsubmit   # add --device <backend> for real QPU"
    expect: "exact-circuit vs engine = 3.9e-16; shot error ~1/sqrt(S); ZNE recovers toward noiseless"
  - id: baselines
    desc: "Classical baselines (HAR, GARCH, GJR, AR(3), persistence)"
    cmd: "python3 cli.py run baselines"
    expect: "HAR is the strong bar; GARCH-family and AR below it"
  - id: lstm
    desc: "LSTM baseline (Track A, brief-named)"
    cmd: "python3 cli.py run lstm"
    expect: "LSTM does NOT beat HAR (DM > 0) - honest expected outcome"
  - id: second_family
    desc: "Second reservoir family (Heisenberg XXZ): the no-advantage negative is not Ising-specific"
    cmd: "python3 cli.py run second_family"
    expect: "Heisenberg XXZ also loses to HAR-X (0.650 vs 0.642): the negative is not Ising-specific"
  - id: instance_ensemble
    desc: "Locate the two hardware-measured n=8 instances in a 30-instance ensemble (exact, offline)"
    cmd: "python3 cli.py run instance_ensemble"
    expect: "30-instance ensemble; the scrambled seed-0 graph is the sparser one (exploratory)"
  - id: expressivity
    desc: "Does entanglement predict forecast accuracy? 30-instance test of necessary-not-sufficient"
    cmd: "python3 cli.py run expressivity"
    expect: "0/30 instances beat HAR-X on crisis and calm; no structural quantity predicts accuracy (exploratory)"
  - id: s7_bootstrap
    desc: "Shot-noise bootstrap for the three S7 cross-seed campaigns, incl. the band-test robustness that weakens our own n=8 arm"
    cmd: "python3 cli.py run s7_bootstrap"
    expect: "S7 shot-noise CIs; under the stricter instance-matched comparator the n=8 band test is not robust"
  - id: qpu_bootstrap
    desc: "Shot-noise bootstrap CIs for all 9 hardware campaigns from the committed counts (re-derives every paper number)"
    cmd: "python3 cli.py run qpu_bootstrap"
    expect: "9 campaigns re-derived from committed counts; every margin 9.7-23.9 sigma"
  - id: qpu_fingerprint
    desc: "Readout-corrected coherent-vs-damping noise fingerprint of the scrambled regime from committed counts"
    cmd: "python3 cli.py run qpu_fingerprint"
    expect: "scrambled regime: mean bias b=+0.128, 90% coherent residual"
  - id: credit_audit
    desc: "Re-derive the whole-program QPU cost from published pricing; assert every campaign + the org ceiling (no API key needed)"
    cmd: "python3 cli.py run credit_audit"
    expect: "ALL CAMPAIGNS RECONCILE; org settled 60,698.25 <= 65,000 ceiling"
groups:   # kept in lockstep with cli.py GROUPS (tests.py asserts the sync)
  headline: [prereg, scaling, axisB_rig, canonical, mnist, tensor]
  phase2: [tests, calm, crisis, kernel, sdk]
  reproduce: [tests, calm, crisis, kernel, sdk, qsubmit, baselines, lstm, prereg, scaling,
              axisB, axisB_rig, canonical, mnist, mnist_noise, tensor,
              economics, capacity, frontier, noise_circuit]
  verify: [tests, qpu_selftest, credit_audit, qpu_bootstrap, qpu_fingerprint]   # one-command offline integrity audit
  all: []   # every action above; see `python3 cli.py list`

hardware_plan:
  primary: "simulator-first (statevector dense <=12q; sparse/TN to ~16q)"
  qpu_validation: "gate-Trotter circuit (sdk_demo.py, ~380 native gates) on IonQ/IQM/IBM via qBraid"
  error_mitigation: [ZNE (Mitiq), measurement mitigation (mthree)]
  note: "QCi Dirac-3 is for the separate optimization challenge, not this QRC track."
